<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Your Name</title>

    <!-- Google Fonts - Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============================================
         HEADER / NAVIGATION
         ============================================ -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <!-- YOUR NAME - Change this to your name -->
                <a class="navbar-brand" href="index.html">
                    <!-- [CUSTOMIZE] Replace with your name -->
                    Your Name
                </a>

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation Links -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#work">Work</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="resume.html">Resume</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- ============================================
         CONTACT PAGE CONTENT
         ============================================ -->
    <section class="page-hero">
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <h1 class="page-title">Get in Touch</h1>
                    <p class="page-subtitle">
                        <!-- [CUSTOMIZE] Your contact message -->
                        I'm always interested in hearing about new projects and opportunities.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="contact-content">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">

                    <!-- Email -->
                    <div class="contact-block">
                        <h2 class="contact-label">Email</h2>
                        <!-- [CUSTOMIZE] Replace with your email -->
                        <a href="mailto:your.email@example.com" class="contact-email">
                            your.email@example.com
                        </a>
                    </div>

                    <!-- Location -->
                    <div class="contact-block">
                        <h2 class="contact-label">Location</h2>
                        <!-- [CUSTOMIZE] Replace with your location -->
                        <p class="contact-location">
                            City, Country
                        </p>
                    </div>

                    <!-- Social Links -->
                    <div class="contact-block">
                        <h2 class="contact-label">Connect</h2>
                        <div class="social-links">
                            <!-- [CUSTOMIZE] Add your social media links -->
                            <a href="#" class="social-link" target="_blank">LinkedIn</a>
                            <a href="#" class="social-link" target="_blank">Dribbble</a>
                            <a href="#" class="social-link" target="_blank">Behance</a>
                            <a href="#" class="social-link" target="_blank">GitHub</a>
                            <a href="#" class="social-link" target="_blank">Twitter</a>
                        </div>
                    </div>

                </div>

                <div class="col-lg-5 offset-lg-1">

                    <!-- Contact Form (Optional) -->
                    <div class="contact-form-wrapper">
                        <h2 class="contact-label">Send a Message</h2>

                        <!-- [CUSTOMIZE] Connect this form to your backend or use a service like Formspree -->
                        <form class="contact-form" action="#" method="POST">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn-submit">Send Message</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- ============================================
         FOOTER
         ============================================ -->
    <footer class="site-footer">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <p class="footer-text">
                        <!-- [CUSTOMIZE] Your copyright text -->
                        &copy; 2024 Your Name. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- ============================================
         SCRIPTS
         ============================================ -->
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Bootstrap 4 JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>

</body>
</html>
